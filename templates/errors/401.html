<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Required | NexusAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        
        .error-container {
            max-width: 600px;
            padding: 3rem;
            margin: 0 auto;
        }
        
        .error-content {
            text-align: center;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Orbitron', sans-serif;
        }
        
        .error-title {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            font-family: 'Orbitron', sans-serif;
        }
        
        .error-message {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 500px;
            margin: 0 auto 1.5rem auto;
        }
        
        .error-icon {
            color: #9b59b6;
            margin-bottom: 2rem;
        }
        
        .error-actions {
            margin-top: 2rem;
        }
        
        .btn {
            display: inline-block;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
            user-select: none;
            border: 1px solid transparent;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: 0.25rem;
            transition: all 0.15s ease-in-out;
            text-decoration: none;
            margin: 0 0.5rem;
        }
        
        .btn-primary {
            background-color: #6e42ff;
            border-color: #6e42ff;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #5a36cc;
            border-color: #5a36cc;
        }
        
        .btn-outline-secondary {
            color: #f8fafc;
            border-color: #475569;
        }
        
        .btn-outline-secondary:hover {
            background-color: #475569;
            color: #f8fafc;
        }
        
        .me-2 {
            margin-right: 0.5rem;
        }
        
        .me-3 {
            margin-right: 0.75rem;
        }
        
        .mb-4 {
            margin-bottom: 1.5rem;
        }
        
        .mb-5 {
            margin-bottom: 3rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-code">401</div>
            <div class="error-icon mb-4">
                <i class="fas fa-user-lock fa-4x"></i>
            </div>
            <h1 class="error-title mb-4">Authentication Required</h1>
            <p class="error-message mb-5">You need to be logged in to access this page. Please sign in with your account credentials.</p>
            <div class="error-actions">
                <a href="/accounts/login/" class="btn btn-primary me-3">
                    <i class="fas fa-sign-in-alt me-2"></i>Log In
                </a>
                <a href="/accounts/signup/" class="btn btn-outline-secondary">
                    <i class="fas fa-user-plus me-2"></i>Sign Up
                </a>
            </div>
        </div>
    </div>
</body>
</html>
