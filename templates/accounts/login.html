{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Login</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6e42ff;
            --secondary: #00e5ff;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --light: #f8fafc;
            --gradient-dark: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        
        body {
            background: var(--dark);
            color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 2rem 0;
            box-sizing: border-box;
            overflow: auto;
        }
        

        
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.4rem; /* 20% smaller than 3rem */
            font-weight: 700;
            color: #6e42ff;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }
        
        .auth-container {
            width: 100%;
            max-width: 500px;
            padding: 0 15px;
            position: relative;
            z-index: 1;
            margin: 0 auto;
        }
        
        .auth-card {
            background-color: var(--dark-light);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        h2 {
            color: #ffffff;
            font-size: 2rem; /* 20% smaller than 2.5rem */
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.5rem;
            font-family: 'Orbitron', sans-serif;
        }
        
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.9rem; /* 20% smaller */
        }
        
        .form-label {
            color: #f8f9fa;
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
            font-size: 0.9rem; /* 20% smaller */
        }
        
        .form-control {
            background-color: rgba(18, 18, 18, 0.7);
            border: 1px solid #333;
            color: #f8f9fa;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border-radius: 4px;
            height: auto;
            font-size: 0.9rem; /* 20% smaller */
        }
        
        .form-control:focus {
            background-color: rgba(18, 18, 18, 0.9);
            border-color: #6e42ff;
            color: #f8f9fa;
            box-shadow: none;
        }
        
        .input-icon {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .input-icon i {
            position: absolute;
            left: 12px;
            top: calc(50% - 0.4rem); /* Adjusted for better alignment */
            color: #6e42ff;
            font-size: 0.9rem; /* 20% smaller */
        }
        
        .form-check {
            margin-bottom: 1.5rem;
        }
        
        .form-check-input {
            background-color: rgba(18, 18, 18, 0.7);
            border: 1px solid #6e42ff;
            width: 16px; /* 20% smaller */
            height: 16px; /* 20% smaller */
        }
        
        .form-check-input:checked {
            background-color: #6e42ff;
            border-color: #6e42ff;
        }
        
        .form-check-label {
            margin-left: 8px;
            color: #ccc;
            font-size: 0.85rem; /* 20% smaller */
        }
        
        .forgot-password {
            color: #6e42ff;
            text-decoration: none;
            font-size: 0.8rem; /* 20% smaller */
            display: block;
            text-align: right;
            margin-bottom: 1.5rem;
        }
        
        .btn-primary {
            background-color: #6e42ff;
            border: none;
            padding: 0.7rem;
            font-weight: 600;
            font-size: 0.9rem; /* 20% smaller */
            border-radius: 4px;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover {
            background-color: #5a36cc;
            transform: translateY(-2px);
        }
        
        a {
            color: #6e42ff;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        a:hover {
            color: #00e5ff;
            text-decoration: underline;
        }
        
        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #aaa;
            font-size: 0.85rem; /* 20% smaller */
        }
        
        .error-message {
            color: #ff6b6b;
            font-size: 0.8rem; /* 20% smaller */
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

    
    <div class="auth-container">
        <!-- Logo/Title -->
        <div class="logo-text">NexusAI</div>
        
        <!-- Login Card -->
        <div class="auth-card">
            <h2>Log In</h2>
            <p class="subtitle">Welcome back</p>
            
            {% if messages %}
            <div class="alert alert-danger">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
            {% endif %}
            
            <form method="post" class="auth-form" novalidate>
                {% csrf_token %}
                
                <div class="input-icon">
                    <label for="username" class="form-label">Username or Email</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username or email" required>
                    </div>
                    <div class="error-message username-error"></div>
                </div>
                
                <div class="input-icon">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <div class="error-message password-error"></div>
                </div>
                <div class="d-flex justify-content-between">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary">Log In</button>
                
                <div class="signup-link">
                    Don't have an account? <a href="{% url 'accounts:signup' %}">Sign Up</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Form validation
        (function() {
            'use strict';
            
            const form = document.querySelector('.auth-form');
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            
            const usernameError = document.querySelector('.username-error');
            const passwordError = document.querySelector('.password-error');
            
            form.addEventListener('submit', function(event) {
                let isValid = true;
                
                // Clear previous errors
                usernameError.textContent = '';
                passwordError.textContent = '';
                
                // Username validation
                if (!username.value.trim()) {
                    usernameError.textContent = 'Please enter your username or email';
                    isValid = false;
                }
                
                // Password validation
                if (!password.value) {
                    passwordError.textContent = 'Please enter your password';
                    isValid = false;
                }
                
                if (!isValid) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            });
        })();
    </script>
</body>
</html>
