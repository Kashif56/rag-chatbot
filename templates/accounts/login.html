{% extends 'base.html' %}

{% block title %}Login - RAG-Chatbot{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        min-height: 90vh;
        background: linear-gradient(135deg, var(--light-bg) 0%, #E8EAFD 100%);
    }
    .login-card {
        width: 100%;
        max-width: 460px;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    @media (min-width: 1400px) {
        .login-card {
            max-width: 480px;
        }
    }
    @media (max-width: 768px) {
        .login-card {
            max-width: 90%;
            margin: 1rem;
        }
    }
    .brand-logo {
        font-size: 1.8rem;
        color: var(--primary-color);
        margin-bottom: 0.75rem;
    }
    .ai-decoration {
        position: absolute;
        width: 400px;
        height: 400px;
        right: -200px;
        top: -200px;
        background: radial-gradient(circle, var(--accent-color) 0%, rgba(108,99,255,0) 70%);
        opacity: 0.1;
        border-radius: 50%;
    }
    .card-body {
        padding: 1.5rem;
    }
    .mb-4 {
        margin-bottom: 1rem !important;
    }
    h2 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
    }
    p.text-muted {
        font-size: 0.9rem;
    }
    .form-label {
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 0.3rem;
    }
    .input-group-text {
        font-size: 0.9rem;
    }
    .form-control {
        font-size: 0.9rem;
        padding: 0.5rem 0.75rem;
        height: auto;
    }
    .form-check-label {
        font-size: 0.85rem;
    }
    .btn {
        font-size: 0.9rem;
        padding: 0.5rem 1rem;
    }
    p.text-center {
        font-size: 0.85rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container position-relative overflow-hidden">
    <div class="ai-decoration"></div>
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12">
                <div class="card login-card mx-auto p-3">
                    <div class="card-body">
                        <div class="text-center mb-3">
                            <i class="fas fa-robot brand-logo"></i>
                            <h2>Welcome Back</h2>
                            <p class="text-muted">Access your RAG-Chatbot Dashboard</p>
                        </div>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent">
                                        <i class="fas fa-user text-muted"></i>
                                    </span>
                                    <input type="text" name="username" class="form-control" placeholder="Enter your username">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent">
                                        <i class="fas fa-lock text-muted"></i>
                                    </span>
                                    <input type="password" name="password" class="form-control" placeholder="Enter your password">
                                </div>
                            </div>
                            <div class="mb-3 d-flex justify-content-between align-items-center">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label" for="remember">Remember me</label>
                                </div>
                                <a href="#" class="text-decoration-none" style="font-size: 0.85rem;">Forgot Password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Log In</button>
                            <p class="text-center mb-0">
                                Don't have an account? 
                                <a href="{% url 'accounts:signup' %}" class="text-decoration-none">Sign Up</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
