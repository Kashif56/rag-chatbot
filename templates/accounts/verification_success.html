{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Email Verified</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6e42ff;
            --secondary: #00e5ff;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --light: #f8fafc;
            --gradient-dark: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        
        body {
            background: var(--dark);
            color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            overflow: auto;
        }
        
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #6e42ff;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }
        
        .success-container {
            width: 100%;
            max-width: 600px;
            padding: 0 15px;
            position: relative;
            z-index: 1;
            margin: 0 auto;
        }
        
        .success-card {
            background-color: var(--dark-light);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .success-icon {
            font-size: 5rem;
            color: #28a745;
            margin-bottom: 1.5rem;
        }
        
        h2 {
            color: #ffffff;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
            font-family: 'Orbitron', sans-serif;
        }
        
        .btn-primary {
            background-color: #6e42ff;
            border: none;
            padding: 0.7rem 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 4px;
            margin-top: 2rem;
            transition: all 0.2s ease;
            display: inline-block;
        }
        
        .btn-primary:hover {
            background-color: #5a36cc;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <!-- Logo/Title -->
        <div class="logo-text">NexusAI</div>
        
        <!-- Success Card -->
        <div class="success-card">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>Email Verified Successfully!</h2>
            <p>Your email has been verified and your account is now active. You can now access all features of NexusAI.</p>
            <a href="{% url 'chat:dashboard' %}" class="btn btn-primary">Go to Dashboard</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
