{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Sign Up</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6e42ff;
            --secondary: #00e5ff;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --light: #f8fafc;
            --gradient-dark: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        h2{
            font-size: 1.5rem !important;
        }

        label{
            font-size: 0.8rem !important;
        }

        input{
            max-height: 40px !important;
            font-size: 0.8rem !important;
        }
        
        body {
            background: var(--dark);
            color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            overflow: auto;
        }
        

        
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.4rem; /* 20% smaller than 3rem */
            font-weight: 700;
            color: #6e42ff;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }
        
        .auth-container {
            width: 100%;
            max-width: 600px;
            padding: 0 15px;
            position: relative;
            z-index: 1;
            margin: 0 auto;
        }
        
        .auth-card {
            background-color: var(--dark-light);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        h2 {
            color: #ffffff;
         
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.5rem;
            font-family: 'Orbitron', sans-serif;
        }
        
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.9rem; /* 20% smaller */
        }
        
        .form-label {
            color: #f8f9fa;
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
            font-size: 0.9rem; /* 20% smaller */
        }
        
        .form-control {
            background-color: rgba(18, 18, 18, 0.7);
            border: 1px solid #333;
            color: #f8f9fa;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border-radius: 4px;
            height: auto;
            font-size: 0.9rem; /* 20% smaller */
        }
        
        .form-control:focus {
            background-color: rgba(18, 18, 18, 0.9);
            border-color: #6e42ff;
            color: #f8f9fa;
            box-shadow: none;
        }
        
        .input-icon {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .input-icon i {
            position: absolute;
            left: 12px;
            top: calc(50% - 0.4rem); /* Adjusted for better alignment */
            color: #7f58ff;
            font-size: 0.9rem; /* 20% smaller */
        }
        
        .form-check {
            margin: 1.5rem 0;
        }
        
        .form-check-input {
            background-color: rgba(18, 18, 18, 0.7);
            border: 1px solid #6e42ff;
            width: 16px; /* 20% smaller */
            height: 16px; /* 20% smaller */
        }
        
        .form-check-input:checked {
            background-color: #6e42ff;
            border-color: #6e42ff;
        }
        
        .form-check-label {
            margin-left: 8px;
            color: #ccc;
            font-size: 0.85rem; /* 20% smaller */
        }
        
        .btn-primary {
            background-color: #6e42ff;
            border: none;
            padding: 0.7rem;
            font-weight: 600;
            font-size: 0.9rem; /* 20% smaller */
            border-radius: 4px;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover {
            background-color: #5a36cc;
            transform: translateY(-2px);
        }
        
        a {
            color: #6e42ff;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        a:hover {
            color: #00e5ff;
            text-decoration: underline;
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #aaa;
            font-size: 0.85rem; /* 20% smaller */
        }
        
        .error-message {
            color: #ff6b6b;
            font-size: 0.8rem; /* 20% smaller */
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

    
    <div class="auth-container">
        <!-- Logo/Title -->
        <div class="logo-text">NexusAI</div>
        
        <!-- Signup Card -->
        <div class="auth-card">
            <h2>Create your account</h2>
          
            
            {% if messages %}
            <div class="alert alert-danger">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
            {% endif %}
            
            <form method="post" action="{% url 'accounts:signup' %}" class="auth-form mt-4" novalidate>
                {% csrf_token %}
                
                <div class="input-icon">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter a username" required>
                    </div>
                    <div class="error-message username-error"></div>
                </div>
                
                <div class="input-icon">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="error-message email-error"></div>
                </div>
                
                <div class="input-icon">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                    </div>
                    <div class="error-message password-error"></div>
                </div>
                
                <div class="input-icon">
                    <label for="password2" class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm your password" required>
                    </div>
                    <div class="error-message password2-error"></div>
                </div>
                
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                    <label class="form-check-label" for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>
                
                <button type="submit" class="btn btn-primary">Create Account</button>
                
                <div class="login-link">
                    Already have an account? <a href="{% url 'accounts:login' %}">Log In</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Form validation
        (function() {
            'use strict';
            
            const form = document.querySelector('.auth-form');
            const username = document.getElementById('username');
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const password2 = document.getElementById('password2');
            const terms = document.getElementById('terms');
            
            const usernameError = document.querySelector('.username-error');
            const emailError = document.querySelector('.email-error');
            const passwordError = document.querySelector('.password-error');
            const password2Error = document.querySelector('.password2-error');
            
            form.addEventListener('submit', function(event) {
                let isValid = true;
                
                // Clear previous errors
                usernameError.textContent = '';
                emailError.textContent = '';
                passwordError.textContent = '';
                password2Error.textContent = '';
                
                // Username validation
                if (!username.value.trim()) {
                    usernameError.textContent = 'Please enter a username';
                    isValid = false;
                }
                
                // Email validation
                if (!email.value.trim()) {
                    emailError.textContent = 'Please enter an email address';
                    isValid = false;
                } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
                    emailError.textContent = 'Please enter a valid email address';
                    isValid = false;
                }
                
                // Password validation
                if (!password.value) {
                    passwordError.textContent = 'Please create a password';
                    isValid = false;
                } else if (password.value.length < 8) {
                    passwordError.textContent = 'Password must be at least 8 characters';
                    isValid = false;
                }
                
                // Confirm password validation
                if (!password2.value) {
                    password2Error.textContent = 'Please confirm your password';
                    isValid = false;
                } else if (password.value !== password2.value) {
                    password2Error.textContent = 'Passwords do not match';
                    isValid = false;
                }
                
                // Terms validation
                if (!terms.checked) {
                    isValid = false;
                }
                
                if (!isValid) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            });
        })();
    </script>
</body>
</html>
