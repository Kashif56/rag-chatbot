{% extends 'base.html' %}

{% block title %}Sign Up - RAG-Chatbot{% endblock %}

{% block extra_css %}
<style>
    .signup-container {
        min-height: 90vh;
        background: linear-gradient(135deg, var(--light-bg) 0%, #E8EAFD 100%);
    }
    .signup-card {
        width: 100%;
        max-width: 460px;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    @media (min-width: 1400px) {
        .signup-card {
            max-width: 480px;
        }
    }
    @media (max-width: 768px) {
        .signup-card {
            max-width: 90%;
            margin: 1rem;
        }
    }
    .brand-logo {
        font-size: 1.8rem;
        color: var(--primary-color);
        margin-bottom: 0.75rem;
    }
    .ai-decoration {
        position: absolute;
        width: 400px;
        height: 400px;
        left: -200px;
        bottom: -200px;
        background: radial-gradient(circle, var(--accent-color) 0%, rgba(108,99,255,0) 70%);
        opacity: 0.1;
        border-radius: 50%;
    }
    .card-body {
        padding: 1.5rem;
    }
    .mb-4 {
        margin-bottom: 1rem !important;
    }
    .row > div[class^="col-"] {
        padding: 0 0.5rem;
    }
    .input-group {
        flex-wrap: nowrap;
    }
    h2 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
    }
    p.text-muted {
        font-size: 0.9rem;
    }
    .form-label {
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 0.3rem;
    }
    .input-group-text {
        font-size: 0.9rem;
    }
    .form-control {
        font-size: 0.9rem;
        padding: 0.5rem 0.75rem;
        height: auto;
    }
    .form-check-label {
        font-size: 0.85rem;
    }
    .btn {
        font-size: 0.9rem;
        padding: 0.5rem 1rem;
    }
    p.text-center {
        font-size: 0.85rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="signup-container position-relative overflow-hidden">
    <div class="ai-decoration"></div>
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12">
                <div class="card signup-card mx-auto p-3">
                    <div class="card-body">
                        <div class="text-center mb-3">
                            <i class="fas fa-robot brand-logo"></i>
                            <h2>Create Account</h2>
                            <p class="text-muted">Join RAG-Chatbot and start building your knowledge base</p>
                        </div>
                        <form method="post">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">First Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent">
                                            <i class="fas fa-user text-muted"></i>
                                        </span>
                                        <input type="text" name="first_name" class="form-control" placeholder="First name">
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Last Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent">
                                            <i class="fas fa-user text-muted"></i>
                                        </span>
                                        <input type="text" name="last_name" class="form-control" placeholder="Last name">
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent">
                                        <i class="fas fa-envelope text-muted"></i>
                                    </span>
                                    <input type="email" name="email" class="form-control" placeholder="Enter your email">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent">
                                        <i class="fas fa-lock text-muted"></i>
                                    </span>
                                    <input type="password" name="password1" class="form-control" placeholder="Create password">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent">
                                        <i class="fas fa-lock text-muted"></i>
                                    </span>
                                    <input type="password" name="password2" class="form-control" placeholder="Confirm password">
                                </div>
                            </div>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="terms" required>
                                    <label class="form-check-label" for="terms">
                                        I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                                    </label>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Create Account</button>
                            <p class="text-center mb-0">
                                Already have an account? 
                                <a href="{% url 'accounts:login' %}" class="text-decoration-none">Log In</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
