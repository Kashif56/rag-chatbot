<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a58ca;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f8f9fa" />
  
  <!-- Chat UI -->
  <rect x="100" y="100" width="600" height="400" rx="15" ry="15" fill="white" stroke="#e9ecef" stroke-width="2" />
  
  <!-- Chat Header -->
  <rect x="100" y="100" width="600" height="60" rx="15" ry="15" fill="url(#grad1)" />
  <text x="150" y="140" font-family="Arial" font-size="20" fill="white">RAG Chatbot</text>
  
  <!-- Chat Messages -->
  <!-- Bot Message 1 -->
  <rect x="120" y="180" width="400" height="50" rx="10" ry="10" fill="#e9ecef" />
  <text x="140" y="210" font-family="Arial" font-size="14" fill="#333">Hello! How can I help you today?</text>
  
  <!-- User Message 1 -->
  <rect x="280" y="250" width="400" height="50" rx="10" ry="10" fill="#0d6efd" />
  <text x="300" y="280" font-family="Arial" font-size="14" fill="white">I need information about your product features.</text>
  
  <!-- Bot Message 2 -->
  <rect x="120" y="320" width="400" height="80" rx="10" ry="10" fill="#e9ecef" />
  <text x="140" y="350" font-family="Arial" font-size="14" fill="#333">Our platform offers custom knowledge base, AI</text>
  <text x="140" y="375" font-family="Arial" font-size="14" fill="#333">chatbots, and easy integration with your website.</text>
  
  <!-- Chat Input -->
  <rect x="120" y="420" width="560" height="50" rx="25" ry="25" fill="white" stroke="#e9ecef" stroke-width="2" />
  <text x="150" y="450" font-family="Arial" font-size="14" fill="#6c757d">Type your message here...</text>
  <circle cx="650" y="445" r="20" fill="#0d6efd" />
  <path d="M645,445 L650,450 L655,445" stroke="white" stroke-width="2" fill="none" />
  
  <!-- Floating Elements -->
  <circle cx="730" y="150" r="30" fill="#0d6efd" fill-opacity="0.1" />
  <circle cx="70" y="450" r="40" fill="#0d6efd" fill-opacity="0.1" />
  <circle cx="750" y="400" r="20" fill="#0d6efd" fill-opacity="0.1" />
  <circle cx="650" y="80" r="15" fill="#0d6efd" fill-opacity="0.1" />
  <circle cx="150" y="500" r="25" fill="#0d6efd" fill-opacity="0.1" />
</svg> 